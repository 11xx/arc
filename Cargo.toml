[package]
name = "arc-ledger"
version = "2026.9.29"
edition = "2021"
build = "build.rs"
description = "Persistent context and guarded workflow state over plain Git for agentic coding arcs."
license = "Unlicense"
readme = "README.md"
repository = "https://github.com/11xx/arc"
keywords = ["git", "changelog", "review", "workflow", "agents"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "arc"
path = "src/main.rs"

[dependencies]
agent-tapes-core = { git = "https://github.com/11xx/tapes", rev = "cad38a376a72e400ea760ddc46282ff29cfc3fe1", version = "2026.9.29" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
clap_mangen = "0.2"
hostname = "0.4"
libc = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
ulid = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
assert_cmd = "2"
hex = "0.4"
predicates = "3"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = true
strip = true

# Development builds, test harnesses and spawned fixtures share one profile, so
# the crate compiles once for all of them. The crate itself is unoptimized,
# which keeps an incremental rebuild after a source edit short; dependencies
# are optimized once and stay cached.
[profile.dev]
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2
