[package]
name = "arc-ledger"
version = "2026.9.4"
edition = "2021"
description = "Change, review, and integration state over plain Git for agentic coding arcs"
license = "Unlicense"
readme = "README.md"
repository = "https://github.com/11xx/arc"
keywords = ["git", "changelog", "review", "workflow", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "arc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
hostname = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ulid = "1"

[dev-dependencies]
assert_cmd = "2"
hex = "0.4"
predicates = "3"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = true
strip = true
