[package]
name = "arc-ledger"
version = "2026.9.29"
edition = "2021"
description = "Persistent context and guarded workflow state over plain Git for agentic coding arcs."
license = "Unlicense"
readme = "README.md"
repository = "https://github.com/11xx/arc"
keywords = ["git", "changelog", "review", "workflow", "agents"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "arc"
path = "src/main.rs"

[dependencies]
agent-tapes-core = { git = "https://github.com/11xx/tapes", rev = "60b760d984d6bffbb8fa3f2ef5e74d84c4322153", version = "2026.9.29" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
hostname = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ulid = "1"

[dev-dependencies]
assert_cmd = "2"
hex = "0.4"
predicates = "3"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = true
strip = true
