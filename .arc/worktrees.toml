# Lanes begin in leased fixed-path checkouts (`arc begin <slug> --slot`), so a
# change starts from the previous change's `target/` instead of a cold build.
[slots]
size = 4
identity = "rustc -vV && cargo -V"
retain = ["target"]
# The warm build is the invariant gate's own build step, so a leased slot
# starts with the artifacts the gate runs and the gate's budget pays only for
# what the change edits. A slot is warmed again at the target after each
# integration.
warm = "cargo test --locked --profile dev --no-run"
warm_after_integrate = true

# The crate is built before a gate runs, as preparation: timed on its own and
# outside the gate's budget, so the budget judges the witnesses and not how
# much of the crate a change made the compiler rebuild.
[prepare]
mode = "path-stable"
# Preparation runs in storage arc manages, outside the checkout, so the
# command names the checkout it builds.
command = "cargo test --locked --profile dev --no-run --manifest-path \"$ARC_WORKTREE_PATH/Cargo.toml\""
timeout = "10m"
