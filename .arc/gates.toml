# Build and lint apply to integration and publication.
[gates.build]
command = "python3 .arc/test-selection.py --unless-markdown 'cargo build --all-targets'"
events = ["integration", "publication"]

[gates.test]
command = "python3 .arc/test_selection_test.py && cargo test"
events = ["publication"]

[gates.test-integration]
command = "python3 .arc/test-selection.py"
events = ["integration"]
selector = "python3 .arc/test-selection.py --selector"
environment = "python3 .arc/test-selection.py --environment"

[gates.lint]
command = "python3 .arc/test-selection.py --unless-markdown 'cargo clippy --all-targets -- -D warnings && cargo fmt --check'"
events = ["integration", "publication"]
