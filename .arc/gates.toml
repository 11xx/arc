# Integration runs the named invariant witnesses and nothing else: the list is
# .arc/invariants.tsv, and the gate compiles the crate to run them, so it is
# also the build check. Lint and the release-artifact checks run at publication.
[budget]
total = "20s"

[selection]
base_passes = true
inert = ["*.md", "tests/*.md", "UNLICENSE"]

[gates.invariants]
budget = "20s"
command = "python3 .arc/test-binary.py invariants"
paths = ["src/", "tests/", ".arc/", "Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", "Makefile", ".gitignore"]
events = ["integration", "publication"]
timings = ".arc/invariant-timings.tsv"

[gates.lint]
command = "cargo clippy --locked --all-targets -- -D warnings && cargo fmt --check"
paths = ["src/", "tests/", ".arc/", "Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", "Makefile", ".gitignore"]
events = ["publication"]

[gates.release]
command = "python3 .arc/test-binary.py release"
paths = ["src/", "tests/", ".arc/", "Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", "Makefile", ".gitignore"]
events = ["publication"]
