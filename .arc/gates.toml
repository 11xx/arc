[confine]
writes = [
  "target",
  "${CARGO_HOME:-~/.cargo}/registry",
  "${CARGO_HOME:-~/.cargo}/git",
  "${CARGO_HOME:-~/.cargo}/.package-cache",
  "${CARGO_HOME:-~/.cargo}/.package-cache-mutate",
]

# Integration runs the named invariant witnesses and nothing else: the list is
# .arc/invariants.tsv, and the gate compiles the crate to run them, so it is
# also the build check. Lint, the release-artifact checks and the whole
# remaining suite run at publication, which is rare and off the landing path.
[budget]
total = "20s"

[selection]
base_passes = true
inert = ["*.md", "tests/*.md", "UNLICENSE"]

[gates.invariants]
budget = "20s"
command = "python3 .arc/test-binary.py invariants"
paths = ["src/", "tests/", ".arc/", "Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", "Makefile", ".gitignore"]
events = ["integration", "publication"]
# Written beside the build output, which slots retain: an ignored file anywhere
# else in the checkout would stop a slot being reused.
timings = "target/invariant-timings.tsv"

[gates.lint]
command = "cargo clippy --locked --all-targets -- -D warnings && cargo fmt --check"
paths = ["src/", "tests/", ".arc/", "Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", "Makefile", ".gitignore"]
events = ["publication"]

[gates.release]
command = "python3 .arc/test-binary.py release"
paths = ["src/", "tests/", ".arc/", "Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", "Makefile", ".gitignore"]
events = ["publication"]

[gates.suite]
command = "cargo test --locked"
paths = ["src/", "tests/", ".arc/", "Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", "Makefile", ".gitignore"]
events = ["publication"]
