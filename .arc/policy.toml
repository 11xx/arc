[policy]
forbid_self_approval = true
# OpenAI and Anthropic are the only accessible frontier labs for this election.
# The operator elects Sol 6.1 xhigh to break mixed-lab review ties.
tiebreak_reviewers = [
  { model = "gpt-6.1-sol#xhigh", since = "2026-11-04T00:00:00Z" },
]

[provenance]
git_identity = "shared"

# Surfaces where a verdict must come from somebody other than the author.
# Everywhere else a self-recorded verdict satisfies the gate.
#
# A uniform gate over non-uniform risk produces a uniform workaround, spent
# most freely on the changes that needed it least — which destroys the signal
# the audit-debt queue exists to carry. These are the surfaces where a defect
# is unrecoverable, self-concealing, or lands in history other work depends on.
#
# A literal path that names nothing is worse than no entry at all: it reads as
# coverage while leaving the surface on a self-verdict. `arc doctor` reports
# declared literals that match no file.
[danger]
paths = [
  # Replay and store format: a defect corrupts an append-only history silently.
  "src/store.rs",
  "src/replica.rs",
  "src/state.rs",
  "src/model.rs",
  "src/forge_observation.rs",
  "src/received_evidence.rs",
  "src/forge_round_trip.rs",
  "src/import_authorization.rs",
  "src/session_store.rs",
  "src/bundle.rs",
  "src/rewrite.rs",
  # Verdict, gate, and check logic: a broken gate reports green.
  "src/policy.rs",
  "src/gates.rs",
  "src/warm_worktree.rs",
  "src/warm_worktree/stable.rs",
  # Chooses whose gate and policy declarations a change is judged by.
  "src/declarations.rs",
  "src/status.rs",
  "src/blockers.rs",
  # Decides whether an approval counts for the head being integrated.
  "src/approval.rs",
  "src/inbox.rs",
  "src/commands/review.rs",
  "src/commands/audit.rs",
  # Records receipt items as verdicts and audits on a reviewer's behalf.
  "src/commands/receipt.rs",
  "src/commands/external.rs",
  # `squash` moves a change's branch to a new commit and records the patchset.
  "src/commands/squash.rs",
  "src/commands/policy_cmd.rs",
  # `begin` records the --dangerous escalation here, so this file decides a
  # change's own gate and must not sit outside it.
  "src/commands/lifecycle.rs",
  # `fork begin` creates worktrees, `fork retire` removes them, and the
  # integrate refusal constrains that lifecycle. The identity resolver decides
  # which recorded fork those operations address. Worktree state is the cost
  # surface a full disk hides in.
  "src/commands/fork.rs",
  "src/commands/fork/identity.rs",
  # `sandbox discard` removes a whole directory tree and `sandbox clone` writes
  # a second copy of the ledger and journal. A defect deletes recorded state or
  # leaves a duplicate of it that reads as the original.
  "src/commands/sandbox.rs",
  # Slots create, switch, detach and release retained checkouts, delete merged
  # branches, and run every gate in a slot under a holder whose report becomes
  # the gate's exit status. A defect takes another change's checkout or
  # records a gate result its command never produced.
  "src/slots.rs",
  "src/commands/slots.rs",
  # Integrate and merge: the only path that writes to a shared branch.
  "src/gitio.rs",
  # Freshness boundaries prevent a cached pre-write answer from authorizing a merge.
  "src/gitio/answers.rs",
  # Subprocess isolation prevents inherited Git state from reaching another repository.
  "src/child_command.rs",
  # Enforces destination writable roots before project commands execute.
  "src/confinement.rs",
  # Typed command construction and Git hook forwarding preserve destination authority.
  "src/project_command.rs",
  "src/git_hooks.rs",
  # Confinement witnesses must reject commands that escape writable roots.
  "src/confinement/tests.rs",
  "tests/cli/confinement.rs",
  # Publication rejects constructors that bypass subprocess isolation.
  "clippy.toml",
  # Commit identity admission and configuration health reject contamination.
  "src/git_health.rs",
  # Guard witnesses must not report unsafe repository access as green.
  "tests/cli/git_environment.rs",
  # Batched answers `gitio` takes before running Git itself: ancestry,
  # cleanliness and merge outcomes a status report's readiness rests on. A
  # stale held answer reads as what Git would say now.
  "src/gitio/listing.rs",
  "src/gitio/listing/tests.rs",
  "src/chain.rs",
  "src/commands/gatekeeping.rs",
  # Budgets, raises, base passes and concurrent batches decide whether a
  # passing run is green, and timing receipts are what a budget judges: a
  # defect accepts a run that should have been refused, or answers a gate
  # from an execution that does not cover the change.
  "src/gate_budget.rs",
  # Work witnesses and inherited hardware counters can excuse a clock overrun.
  "src/gate_work.rs",
  "src/instruction_counter.rs",
  "src/gate_raise.rs",
  "src/commands/gate_raise.rs",
  "src/base_pass.rs",
  "src/gate_concurrency.rs",
  "src/commands/gatekeeping/together.rs",
  "src/commands/gate_reports/concurrent.rs",
  "src/verification_timing.rs",
  # Host locks decide that two runs of a gate never overlap; a lock released
  # early lets a pass stand that a concurrent run disturbed.
  "src/exclusive.rs",
  # Derives who wrote a patchset, which is what a reviewer's independence is
  # judged against.
  "src/commands/snapshot_attribution.rs",
  "src/commands/publication.rs",
  # Decides whether a merge is authorized and what it must ship.
  "src/integration.rs",
  # `land` moves a target over several changes in one ref transaction and
  # derives every member's closure from one completion; lands-with decides
  # which changes may integrate alone.
  "src/commands/land.rs",
  "src/landing.rs",
  "src/provisional.rs",
  "src/commands/provisional.rs",
  "src/commands/chain.rs",
  # Output schemas, and this file, which decides all of the above.
  "src/render.rs",
  "src/config.rs",
  ".arc/policy.toml",
  # Gate declarations decide which commands and probes can satisfy integration.
  ".arc/gates.toml",
  # Preparation runs before a gate and outside its budget, and is read from
  # the change's own tree: work moved here from a gate escapes the budget.
  ".arc/worktrees.toml",
  # The invariant gate is this runner executing this list: an edit to either
  # can make the gate pass without proving anything.
  ".arc/test-binary.py",
  ".arc/invariants.tsv",
  # Every test harness enters through this file, which confines its writes
  # and keeps inherited Git variables from its fixtures: a defect lets a
  # fixture rewrite the configuration or history of the repository running
  # the suite.
  "src/harness_entry.rs",
  # The kernel confinement the entry applies: a defect lets a test write the
  # checkout's repository or the operator's files.
  "src/harness_entry/confine.rs",
  # The changelog renderer runs the program `.arc/changelog.toml` declares,
  # with the invoking user's authority, the way a gate runs its command.
  ".arc/changelog.toml",
  "src/changelog_render.rs",
  # Kills an overrunning declared command with its whole process group. A
  # defect leaves the command running past its bound.
  "src/process_group.rs",
  # Holds SIGINT, SIGTERM and SIGHUP while a gate or probe runs, so arc stops
  # the group it owns and records nothing from an interrupted run. A defect
  # records an interrupted gate as evidence or leaves its processes running.
  "src/interruption.rs",
  # Captures private gate diagnostics and expires its own completed files.
  "src/verification_output.rs",
  # Bundle import writes foreign events into the append-only store.
  "src/commands/bundle_io.rs",
  # The candidate ledger: the rules a local or imported registration must pass.
  "src/candidate.rs",
  # `candidate register` pins a tree and `candidate retire` deletes the pin.
  "src/commands/candidate.rs",
  # Selection decides whether a candidate may ship: every ground a named
  # choice must pass, and the basis recorded when it does.
  "src/selection.rs",
  # `candidate select` and `candidate promote` move a destination branch,
  # update its checkout, and record the patchset; `candidate verify` runs
  # gate commands and records the evidence selection counts.
  "src/commands/selection.rs",
  # The relation ledger: the rules a local or imported relation must pass.
  "src/relations.rs",
  # `context read|declare|capture` write relation events to a change's or
  # the repository's ledger.
  "src/commands/relations.rs",
  "src/commands/replica.rs",
  # Change and event identity: a collision merges two histories silently.
  "src/ids.rs",
  # The health report itself, including the classification check below. A
  # doctor that stops checking reopens the closed world and says nothing.
  "src/commands/doctor.rs",
  # Enforces which payloads may be appended in which lifecycle phase, and
  # constructs the events themselves. A defect here lets a write policy
  # forbids into an append-only history.
  "src/commands/mod.rs",
  # Records the rewrite facts that decide whether a recorded revision was
  # moved or lost. A wrong mapping makes stranded evidence read as recovered.
  "src/commands/history.rs",
  # Performs the rewrite: recreates commits, moves the refs that pin evidence,
  # and records the map every later reading depends on. A defect here strands
  # the history and the ledger's account of it together.
  "src/commands/rewrite.rs",
  # Edits the bytes of every commit message a trailer rewrite touches. A wrong
  # block boundary rewrites prose while claiming to have edited a trailer.
  "src/trailers.rs",
  # Decides what a write may record where a model coordinate or an identity
  # belongs. A defect lets a placeholder or a session id into an append-only
  # history as attribution.
  "src/coordinate.rs",
  # Decides which commits a rewrite keeps reachable as evidence. A defect
  # lets the commit a verdict read be collected after a rewrite moves its
  # pin, and the approval loses the object it judged.
  "src/retention.rs",
  # Holds the bytes a ledger reference names and installs foreign bytes at
  # import. A defect reads damaged or substituted bytes as the evidence the
  # reference claims, or writes outside the ledger's private root.
  "src/custody.rs",
  # Custody's only write and read path: every access resolves the ledger's
  # custody directories without following a link and works inside the handle. A
  # defect reads or writes bytes outside the ledger's private root.
  "src/custody/anchored.rs",
  # Decides what an export publishes and in what order: the sidecar, object
  # list and bundle land together or are taken back. A defect leaves a bundle
  # binding a sidecar that is missing, or replaces a file the caller kept.
  "src/commands/bundle_output.rs",
  # The binding that decides whether an audit's assessment clears an
  # `ineligible-review` debt. A defect clears a debt the auditor did not earn.
  "src/assessment.rs",
  # Dated capability registries and their publication.
  "src/review_ladder.rs",
  "src/review_context.rs",
  "src/review_independence.rs",
  "src/review_clearance.rs",
  "src/review_authors.rs",
  "src/commands/review_ladder.rs",
  # The review ladder decides integration authorization once it exists; the
  # wildcard covers its first import while no file is there yet.
  ".arc/review-ladder*.toml",
  # Artifact storage operations move the only copy of journal history.
  "src/journal.rs",
  # Bundle import writes foreign artifact bodies and events into the journal.
  "src/journal_exchange.rs",
  # A rendered journal page is published and opened in a browser: the renderer
  # must never emit active content, and the private-text scan decides what a
  # published page may carry.
  "src/journal/page.rs",
  "src/journal/private_text.rs",
  # A pin refuses archive and relocation of a standing reference and exempts
  # it from archive sweeps; a defect moves an artifact its pin protects.
  "src/journal/pins.rs",
  # Adoption renames a directory or file into the journal, and archiving moves
  # a workbench between storages: a defect loses or alters the only copy of
  # the working material, and the refusals decide what may be moved at all.
  "src/journal/workbench.rs",
  # Decides what adoption may move: a defect moves a repository, a journal,
  # tracked files or the directory a caller stands in.
  "src/journal/workbench/adoption.rs",
  # Opens, checks and renames the material by descriptor: a defect moves or
  # writes through an object no check looked at.
  "src/journal/workbench/fsat.rs",
  # Decides which ignored content counts as a disposable build artifact.
  # Integration cleanup removes a checkout on this recognition, so a
  # recognizer that over-matches deletes work nobody meant to discard.
  "src/artifacts.rs",
  # Resolves the integration shape, discard mode, and disposable rules a merge
  # and its cleanup run under, and validates the operator constraints on them.
  "src/style.rs",
  # `accept` prepares and lands a transported change: it appends ledger
  # events, and an observation error decides whether it reports success.
  "src/commands/accept.rs",
  # Binds an accept checkout to a change; recovery reads the binding back to
  # decide which checkout a change owns.
  "src/commands/accept_checkout.rs",
  # Collects the effects and event ids `accept` reports, the evidence that
  # decides whether a step succeeded.
  "src/commands/accept_effects.rs",
  # Decides which role values a write records as `Planned-by` and
  # `Orchestrated-by` attribution in an append-only event.
  "src/commands/roles.rs",
  # `checkpoint record` appends a repository event and writes, or on a failed
  # append deletes, a `checkpoint/<name>` tag in the shared ref namespace.
  "src/commands/checkpoint.rs",
  # Decides whether a read covers a debt's extent, so whether the debt is
  # discharged.
  "src/extent.rs",
  # Decides whether a commit map proves an asserted integration that the
  # source head's ancestry does not.
  "src/correspondence.rs",
]

# Roots inside which classification is closed: every tracked file under one of
# these must appear in `paths` or in `acknowledged_safe`, and `arc doctor`
# fails on one that appears in neither or in both.
#
# An open-world list fails in the permissive direction. A file nobody
# classified matches no pattern, looks healthy, and lands on a self-verdict —
# which is how both observed misses happened. Closing the world makes adding
# or renaming a file fail loud instead.
source_roots = ["src/"]

# Files deliberately classified as not dangerous. Each entry is a claim
# somebody made and a reviewer accepted, reviewed once when the boundary is
# drawn rather than taxed on every later edit.
#
# No manual classification detects a file here acquiring dangerous
# responsibility without being reclassified. That limit is real and is not
# approximated with a different spelling of the same manual assertion.
acknowledged_safe = [
  # The opt-in ARC_TRACE record: counters and timers written to stderr at
  # exit. It decides nothing, and a child it counts still runs as the caller
  # built it.
  "src/perf.rs",
  # Launch-count acceptance probes execute only isolated fixture lifecycles.
  "tests/cli/git_questions.rs",
  # Read-only projections and rendering. They report state; they never decide
  # it, and a defect shows up as a wrong screen rather than a wrong merge.
  "src/commands/diff.rs",
  "src/commands/findings.rs",
  "src/commands/observe.rs",
  "src/commands/stats.rs",
  "src/commands/timeline.rs",
  "src/commands/workspace.rs",
  "src/commands/workspace/gates.rs",
  "src/commands/workspace/watch.rs",
  "src/feed.rs",
  # Gate reports, cost diagnosis and recorded check timings describe runs and
  # never judge one. `arc gates init` writes budgets into .arc/gates.toml,
  # which is a dangerous path, so what it writes is reviewed as a diff.
  "src/commands/gate_reports.rs",
  # Landing cost projections and advisory declarations never authorize integration.
  "src/commands/gate_reports/landing.rs",
  "src/gate_diagnostics.rs",
  "src/check_timings.rs",
  "src/context.rs",
  # `arc explain` projects one change's ledger and journal references; it
  # appends nothing and nothing reads its output to decide a merge.
  "src/explain.rs",
  "src/guide.rs",
  # Projects journal pins into labelled guide text; writes no state and grants
  # no workflow authority.
  "src/journal/guide_topics.rs",
  # CLI acceptance probes write only isolated fixture journals.
  "tests/cli/guide_topics.rs",
  # The journal and the liveness signals over it are advisory by construction:
  # claims, lanes, and messages never gate, and the ledger stays authoritative.
  "src/commands/claims.rs",
  "src/commands/messaging.rs",
  "src/intake.rs",
  "src/journal/page.css",
  "src/commands/scaffold.rs",
  "src/commands/scaffolds/*.md",
  # Text `arc instructions git` prints. The checker that judges a message
  # against it is `src/trailers.rs`, not this file.
  "src/commands/contribution-trailers.md",
  # Records carrying no gate authority. A forge fact mirrors what a forge said
  # and authorizes nothing on its own, and a delegated run record asserts what a
  # caller says it launched: nothing reads either to decide whether work ships.
  "src/commands/changelog.rs",
  "src/commands/run.rs",
  "src/forge_view.rs",
  "src/forge.rs",
  "src/commands/forge_cmd.rs",
  # Cost views read recorded usage. `cost retain` writes an observation event
  # and `cost note` a local Git note, a cache of one read. Nothing reads either
  # to authorize work, so a defect renders a wrong figure.
  "src/commands/cost.rs",
  "src/commands/cost/evidence.rs",
  "src/commands/cost/span.rs",
  "src/commands/cost_commit.rs",
  "src/commands/cost_liveness.rs",
  "src/commands/cost_read.rs",
  "src/commands/cost_table.rs",
  # Identifies a native child a dispatch binding names, for measurement, as
  # `src/commands/run.rs` records the binding itself.
  "src/commands/native_child.rs",
  # Review assurance reads the verdicts and audits the ledger holds, git blame
  # at a revision, and routing's frontier, keeping only a per-change blame
  # cache. It reports how a change was read; nothing reads it to authorize work.
  "src/assurance.rs",
  "src/assurance_live.rs",
  "src/assurance_routing.rs",
  # A pass records what a caller says it opened and nothing reads it to decide
  # whether work ships.
  "src/commands/pass.rs",
  # Read-only disk accounting over worktrees arc already created. It decides
  # nothing and deletes nothing; a defect renders a wrong number.
  "src/worktree_usage.rs",
  # Discovery and CLI wiring: which repository, which command, which flags.
  "src/main.rs",
  "src/project.rs",
  "src/registry.rs",
  # Sandbox writability probes, despite the name: it reads no policy.
  "src/commands/config_cmd.rs",
  # Recovery and opt-in tooling. Installed only by explicit action, and every
  # arc hook exits 0 unconditionally so it can never block a commit.
  "src/commands/rescue.rs",
  "src/commands/hooks.rs",
  # Captures printed text so a coordinator can render one document. Callers
  # embed the captured string in their own output; it is written to no event
  # and read by no gate.
  "src/operation_output.rs",
]
