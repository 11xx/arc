[policy]
forbid_self_approval = true

[provenance]
git_identity = "shared"

# Surfaces where a verdict must come from somebody other than the author.
# Everywhere else a self-recorded verdict satisfies the gate.
#
# A uniform gate over non-uniform risk produces a uniform workaround, spent
# most freely on the changes that needed it least — which destroys the signal
# the audit-debt queue exists to carry. These are the surfaces where a defect
# is unrecoverable, self-concealing, or lands in history other work depends on.
#
# A literal path that names nothing is worse than no entry at all: it reads as
# coverage while leaving the surface on a self-verdict. `arc doctor` reports
# declared literals that match no file.
[danger]
paths = [
  # Replay and store format: a defect corrupts an append-only history silently.
  "src/store.rs",
  "src/state.rs",
  "src/model.rs",
  "src/session_store.rs",
  "src/bundle.rs",
  "src/rewrite.rs",
  # Verdict, gate, and check logic: a broken gate reports green.
  "src/policy.rs",
  "src/gates.rs",
  "src/status.rs",
  "src/inbox.rs",
  "src/commands/review.rs",
  "src/commands/audit.rs",
  # `begin` records the --dangerous escalation here, so this file decides a
  # change's own gate and must not sit outside it.
  "src/commands/lifecycle.rs",
  # `fork begin` creates worktrees, `fork retire` removes them, and the
  # integrate refusal constrains that lifecycle. The identity resolver decides
  # which recorded fork those operations address. Worktree state is the cost
  # surface a full disk hides in.
  "src/commands/fork.rs",
  "src/commands/fork/identity.rs",
  # `sandbox discard` removes a whole directory tree and `sandbox clone` writes
  # a second copy of the ledger and journal. A defect deletes recorded state or
  # leaves a duplicate of it that reads as the original.
  "src/commands/sandbox.rs",
  # Integrate and merge: the only path that writes to a shared branch.
  "src/gitio.rs",
  "src/chain.rs",
  "src/commands/gatekeeping.rs",
  "src/commands/chain.rs",
  # Output schemas, and this file, which decides all of the above.
  "src/render.rs",
  "src/config.rs",
  ".arc/policy.toml",
  # Bundle import writes foreign events into the append-only store.
  "src/commands/bundle_io.rs",
  # Change and event identity: a collision merges two histories silently.
  "src/ids.rs",
  # The health report itself, including the classification check below. A
  # doctor that stops checking reopens the closed world and says nothing.
  "src/commands/doctor.rs",
  # Enforces which payloads may be appended in which lifecycle phase, and
  # constructs the events themselves. A defect here lets a write policy
  # forbids into an append-only history.
  "src/commands/mod.rs",
  # Records the rewrite facts that decide whether a recorded revision was
  # moved or lost. A wrong mapping makes stranded evidence read as recovered.
  "src/commands/history.rs",
  # Performs the rewrite: recreates commits, moves the refs that pin evidence,
  # and records the map every later reading depends on. A defect here strands
  # the history and the ledger's account of it together.
  "src/commands/rewrite.rs",
  # Edits the bytes of every commit message a trailer rewrite touches. A wrong
  # block boundary rewrites prose while claiming to have edited a trailer.
  "src/trailers.rs",
]

# Roots inside which classification is closed: every tracked file under one of
# these must appear in `paths` or in `acknowledged_safe`, and `arc doctor`
# fails on one that appears in neither or in both.
#
# An open-world list fails in the permissive direction. A file nobody
# classified matches no pattern, looks healthy, and lands on a self-verdict —
# which is how both observed misses happened. Closing the world makes adding
# or renaming a file fail loud instead.
source_roots = ["src/"]

# Files deliberately classified as not dangerous. Each entry is a claim
# somebody made and a reviewer accepted, reviewed once when the boundary is
# drawn rather than taxed on every later edit.
#
# No manual classification detects a file here acquiring dangerous
# responsibility without being reclassified. That limit is real and is not
# approximated with a different spelling of the same manual assertion.
acknowledged_safe = [
  # Read-only projections and rendering. They report state; they never decide
  # it, and a defect shows up as a wrong screen rather than a wrong merge.
  "src/commands/diff.rs",
  "src/commands/findings.rs",
  "src/commands/observe.rs",
  "src/commands/stats.rs",
  "src/commands/timeline.rs",
  "src/commands/workspace.rs",
  "src/context.rs",
  "src/guide.rs",
  # The journal and the liveness signals over it are advisory by construction:
  # claims, lanes, and messages never gate, and the ledger stays authoritative.
  "src/journal.rs",
  "src/commands/claims.rs",
  "src/commands/messaging.rs",
  "src/commands/scaffold.rs",
  "src/commands/scaffolds/*.md",
  # Records carrying no gate authority. A forge fact mirrors what a forge said
  # and authorizes nothing on its own, and a delegated run record asserts what a
  # caller says it launched: nothing reads either to decide whether work ships.
  "src/commands/changelog.rs",
  "src/commands/run.rs",
  "src/forge.rs",
  "src/commands/forge_cmd.rs",
  # A pass records what a caller says it opened and nothing reads it to decide
  # whether work ships.
  "src/commands/pass.rs",
  # Read-only disk accounting over worktrees arc already created. It decides
  # nothing and deletes nothing; a defect renders a wrong number.
  "src/worktree_usage.rs",
  # Discovery and CLI wiring: which repository, which command, which flags.
  "src/main.rs",
  "src/project.rs",
  "src/registry.rs",
  # Sandbox writability probes, despite the name: it reads no policy.
  "src/commands/config_cmd.rs",
  # Recovery and opt-in tooling. Installed only by explicit action, and every
  # arc hook exits 0 unconditionally so it can never block a commit.
  "src/commands/rescue.rs",
  "src/commands/hooks.rs",
]
